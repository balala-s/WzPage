<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Pairwise human preference prediction</title>
  <desc id="desc">A shared prompt q and two model responses r A and r B are inputs to a preference model. It predicts probabilities for A, B, and a tie. This is a task schematic, not an experimental result.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L7 3.5L0 7Z" fill="#52565c"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#25282d">
    <text x="17" y="31" font-size="22" font-weight="600">(a) Dialogue pair</text>
    <text x="286" y="31" font-size="22" font-weight="600">(b) Preference prediction</text>
    <path d="M17 46H249M286 46H623" stroke="#c9cbd0" stroke-width="1.2"/>
    <rect x="17" y="62" width="232" height="226" rx="8" fill="#fcfcfc" stroke="#969ba3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="32" y="77" width="202" height="44" rx="5" fill="#f1f2f4" stroke="#9299a2" stroke-width="1.4"/>
    <text x="133" y="106" text-anchor="middle" font-size="22">Prompt <tspan font-family="Times New Roman, Times, serif" font-style="italic" font-size="26">q</tspan></text>
    <g fill="none" stroke="#52565c" stroke-width="1.5">
      <path d="M133 121V135M80 135H187M80 135V149" marker-end="url(#arrow)"/>
      <path d="M187 135V149" marker-end="url(#arrow)"/>
    </g>
    <rect x="32" y="153" width="96" height="117" rx="5" fill="#edf3f8" stroke="#7e9bb6" stroke-width="1.5"/>
    <path d="M32 188H128" stroke="#b5c7d7" stroke-width="1.2"/>
    <text x="80" y="177" text-anchor="middle" fill="#3c5f80" font-size="21" font-weight="600">Model A</text>
    <text x="80" y="219" text-anchor="middle" fill="#3c5f80" font-family="Times New Roman, Times, serif" font-style="italic" font-size="31">r<tspan baseline-shift="sub" font-size="19">A</tspan></text>
    <path d="M49 239H111M49 248H98" stroke="#97adc1" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="138" y="153" width="96" height="117" rx="5" fill="#fbf1e8" stroke="#b89a7d" stroke-width="1.5"/>
    <path d="M138 188H234" stroke="#dbc6b3" stroke-width="1.2"/>
    <text x="186" y="177" text-anchor="middle" fill="#886345" font-size="21" font-weight="600">Model B</text>
    <text x="186" y="219" text-anchor="middle" fill="#886345" font-family="Times New Roman, Times, serif" font-style="italic" font-size="31">r<tspan baseline-shift="sub" font-size="19">B</tspan></text>
    <path d="M155 239H217M155 248H204" stroke="#c3a68b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M250 183H286" fill="none" stroke="#52565c" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="292" y="122" width="130" height="122" rx="6" fill="#f4f4f2" stroke="#62676e" stroke-width="1.6"/>
    <text x="357" y="163" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic" font-size="35">f<tspan baseline-shift="sub" font-size="23">θ</tspan></text>
    <text x="357" y="197" text-anchor="middle" font-size="22">Preference</text>
    <text x="357" y="224" text-anchor="middle" font-size="22">model</text>
    <g fill="none" stroke="#52565c" stroke-width="1.6">
      <path d="M423 183H447M447 111V255"/>
      <path d="M447 111H467" marker-end="url(#arrow)"/>
      <path d="M447 183H467" marker-end="url(#arrow)"/>
      <path d="M447 255H467" marker-end="url(#arrow)"/>
    </g>
    <circle cx="447" cy="183" r="2.7" fill="#52565c"/>
    <rect x="474" y="87" width="149" height="48" rx="5" fill="#edf3f8" stroke="#7e9bb6" stroke-width="1.4"/>
    <rect x="474" y="159" width="149" height="48" rx="5" fill="#fbf1e8" stroke="#b89a7d" stroke-width="1.4"/>
    <rect x="474" y="231" width="149" height="48" rx="5" fill="#f0f2ef" stroke="#949d90" stroke-width="1.4"/>
    <g text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="29">
      <text x="548" y="121" fill="#3c5f80"><tspan font-style="italic">p</tspan>(A)</text>
      <text x="548" y="193" fill="#886345"><tspan font-style="italic">p</tspan>(B)</text>
      <text x="548" y="265" fill="#586551"><tspan font-style="italic">p</tspan>(tie)</text>
    </g>
    <path d="M17 305H623" stroke="#d3d5d8" stroke-width="1"/>
    <text x="320" y="338" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="26">
      <tspan font-style="italic">p</tspan>(A), <tspan font-style="italic">p</tspan>(B), <tspan font-style="italic">p</tspan>(tie) = <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="18">θ</tspan><tspan baseline-shift="baseline">(</tspan><tspan font-style="italic">q</tspan>, <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="18">A</tspan><tspan baseline-shift="baseline">, </tspan><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="18">B</tspan><tspan baseline-shift="baseline">)</tspan>
    </text>
  </g>
</svg>
